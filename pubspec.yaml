name: datalocal
description: "Encrypted document-style local persistence for Flutter with queries, reactive snapshots, migration, and recoverable SharedPreferences storage."
repository: "https://github.com/lamun-my-id/datalocal.git"
version: 2.0.0
# test    : dart pub publish --dry-run
# deploy  : dart pub publish

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  pointycastle: ^4.0.0
  intl: ^0.20.3
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.31.0

flutter:
  uses-material-design: true

topics:
  - database
  - encryption
  - local-storage
  - persistence
  - shared-preferences
